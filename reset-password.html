<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redefinir senha - Fanjoy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #ff6bce 0%, #7c3aed 52%, #22d2ff 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: #1a1a2e;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at 20% 30%, rgba(255, 255, 255, 0.13) 0%, transparent 48%),
        radial-gradient(circle at 80% 70%, rgba(255, 255, 255, 0.12) 0%, transparent 48%);
      pointer-events: none;
    }

    .top-brand {
      position: fixed;
      top: 16px;
      left: 18px;
      z-index: 2;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: #fff;
      text-decoration: none;
      font-weight: 800;
      font-size: 20px;
    }

    .top-brand img {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      object-fit: cover;
    }

    .auth-container {
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(20px);
      border-radius: 24px;
      padding: 44px 38px;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.28);
      position: relative;
      z-index: 1;
    }

    .auth-header {
      text-align: center;
      margin-bottom: 28px;
    }

    .auth-logo {
      font-size: 38px;
      margin-bottom: 8px;
    }

    h1 {
      font-size: 28px;
      font-weight: 800;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #ff6bce, #7c3aed);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    p {
      color: #6b7280;
      font-size: 14px;
      line-height: 1.5;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-weight: 700;
      font-size: 14px;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      padding: 14px 16px;
      border: 2px solid rgba(0, 0, 0, 0.1);
      border-radius: 12px;
      font: inherit;
      background: rgba(255, 255, 255, 0.84);
    }

    input:focus {
      outline: none;
      border-color: #ff6bce;
      box-shadow: 0 0 0 4px rgba(255, 107, 206, 0.1);
      background: #fff;
    }

    .message {
      display: none;
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 14px;
      margin-bottom: 18px;
      border: 1px solid;
    }

    .message.error {
      background: rgba(239, 68, 68, 0.1);
      color: #dc2626;
      border-color: rgba(239, 68, 68, 0.2);
    }

    .message.success {
      background: rgba(34, 197, 94, 0.1);
      color: #16a34a;
      border-color: rgba(34, 197, 94, 0.2);
    }

    .message.show {
      display: block;
    }

    .btn-submit {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #ff6bce, #7c3aed);
      color: #fff;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 10px 30px rgba(255, 107, 206, 0.34);
    }

    .btn-submit:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    .back-link {
      text-align: center;
      margin-top: 20px;
    }

    .back-link a {
      color: #6b7280;
      text-decoration: none;
      font-size: 14px;
      font-weight: 700;
    }

    .back-link a:hover {
      color: #ff6bce;
    }
  </style>
</head>
<body>
  <a class="top-brand" href="index.html">
    <img src="logo.png" alt="Fanjoy">
    <span>Fanjoy</span>
  </a>

  <main class="auth-container">
    <div class="auth-header">
      <div class="auth-logo">Fanjoy</div>
      <h1>Redefinir senha</h1>
      <p>Digite uma nova senha para acessar sua conta Fanjoy.</p>
    </div>

    <div class="message error" id="resetError"></div>
    <div class="message success" id="resetSuccess"></div>

    <form id="resetPasswordForm">
      <div class="form-group">
        <label for="newPassword">Nova senha</label>
        <input type="password" id="newPassword" minlength="6" required autocomplete="new-password">
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirmar nova senha</label>
        <input type="password" id="confirmPassword" minlength="6" required autocomplete="new-password">
      </div>

      <button type="submit" class="btn-submit">Salvar nova senha</button>
    </form>

    <div class="back-link">
      <a href="customer-login.html">Voltar para o login</a>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/api.js"></script>
  <script>
    function showMessage(id, message) {
      const el = document.getElementById(id);
      if (!el) return;
      el.textContent = message;
      el.classList.add('show');
    }

    function hideMessages() {
      document.querySelectorAll('.message').forEach((el) => el.classList.remove('show'));
    }

    async function prepareRecoverySession() {
      const params = new URLSearchParams(window.location.search);
      const hash = new URLSearchParams((window.location.hash || '').replace(/^#/, ''));
      const error = params.get('error_description') || hash.get('error_description');
      if (error) {
        showMessage('resetError', decodeURIComponent(error));
        return false;
      }

      const result = await FanjoyAPI.Auth.recoverSessionFromUrl();
      if (!result.success) {
        showMessage('resetError', 'Link inválido ou expirado. Solicite um novo link em “Esqueci minha senha”.');
        return false;
      }
      return true;
    }

    document.addEventListener('DOMContentLoaded', async () => {
      const form = document.getElementById('resetPasswordForm');
      const ready = await prepareRecoverySession();
      if (!ready) {
        form.querySelectorAll('input, button').forEach((el) => { el.disabled = true; });
        return;
      }

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        hideMessages();

        const password = document.getElementById('newPassword').value;
        const confirm = document.getElementById('confirmPassword').value;

        if (password.length < 6) {
          showMessage('resetError', 'A senha deve ter no mínimo 6 caracteres.');
          return;
        }
        if (password !== confirm) {
          showMessage('resetError', 'As senhas não coincidem.');
          return;
        }

        const button = form.querySelector('button[type="submit"]');
        button.disabled = true;
        button.textContent = 'Salvando...';

        const response = await FanjoyAPI.Auth.updatePassword(password);
        if (!response.success) {
          button.disabled = false;
          button.textContent = 'Salvar nova senha';
          showMessage('resetError', response.message || 'Não foi possível atualizar a senha.');
          return;
        }

        showMessage('resetSuccess', 'Senha atualizada com sucesso. Você já pode fazer login.');
        setTimeout(() => {
          window.location.href = 'customer-login.html';
        }, 1600);
      });
    });
  </script>
</body>
</html>
